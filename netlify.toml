[build]
  command = """
    set -e
    echo "=== Starting Blog build process ==="
    echo "Node version: $(node --version)"
    echo "pnpm version: $(pnpm --version)"
    echo "Go version: $(go version || echo 'Go not available')"
    
    echo "=== Installing dependencies ==="
    pnpm install --frozen-lockfile --prod=false

    echo "=== Building verified Hugo with patched embedded Go ==="
    HUGO_BIN="$(bash scripts/prepare-hugo.sh)"
    
    echo "=== Running Hugo build ==="
    "$HUGO_BIN" --gc --minify -b "$URL" --logLevel debug --printI18nWarnings --printPathWarnings
    node scripts/finalize-public.mjs public
    
    echo "=== Running Pagefind indexing ==="
    pnpm exec pagefind --site 'public'
    
    echo "=== Build completed successfully ==="
  """
  publish = "public"

[build.environment]
  # Release identity only: every context executes the verified source-built binary.
  HUGO_VERSION = "0.168.0"
  GO_VERSION = "1.27.3"
  NODE_VERSION = "22.23.4"
  HUGO_ENABLEGITINFO = "true"
  HUGO_LOG_I18N_WARNINGS = "true"
  HUGO_LOG_WARNINGS = "true"
  FORCE_COLOR = "1"
  PNPM_LOG_LEVEL = "debug"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = """
    set -e
    echo "=== Deploy Preview Build ==="
    echo "Deploy URL: $DEPLOY_PRIME_URL"
    pnpm install --frozen-lockfile --prod=false
    HUGO_BIN="$(bash scripts/prepare-hugo.sh)"
    "$HUGO_BIN" --gc --minify --buildFuture -b "$DEPLOY_PRIME_URL" --logLevel debug --printI18nWarnings --printPathWarnings
    node scripts/finalize-public.mjs public
    pnpm exec pagefind --site 'public'
  """

[context.branch-deploy]
  command = """
    set -e
    echo "=== Branch Deploy Build ==="
    echo "Deploy URL: $DEPLOY_PRIME_URL"
    pnpm install --frozen-lockfile --prod=false
    HUGO_BIN="$(bash scripts/prepare-hugo.sh)"
    "$HUGO_BIN" --gc --minify -b "$DEPLOY_PRIME_URL" --logLevel debug --printI18nWarnings --printPathWarnings
    node scripts/finalize-public.mjs public
    pnpm exec pagefind --site 'public'
  """

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true
