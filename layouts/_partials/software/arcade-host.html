{{/* The frame does not exist until the visitor activates Diceratias. */}}
<dialog id="software-arcade-dialog" class="software-arcade-host" aria-labelledby="software-arcade-title" data-game-url="{{ "/software/arcade/index.html" | relURL }}">
  <header class="software-arcade-host__bar">
    <h2 id="software-arcade-title">Angry Anglerfish</h2>
    <button id="software-arcade-exit" class="software-arcade-host__exit" type="button" autofocus>EXIT GAME</button>
  </header>
  <p id="software-arcade-status" class="software-arcade-host__status" role="status">Preparing the arcade…</p>
  <div id="software-arcade-frame-slot" class="software-arcade-host__frame-slot"></div>
</dialog>
